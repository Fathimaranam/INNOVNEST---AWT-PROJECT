<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>InnoNest - Community</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <aside class="sidebar">

        <div class="logo">
            InnoNest
        </div>

        <nav class="sidebar-nav">

            <button class="nav-item" id="navHome">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                <span>Home</span>
            </button>

            <button class="nav-item" id="navDiscover">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"></polygon></svg>
                <span>Discover</span>
            </button>

            <button class="nav-item" id="navIdeas">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-1 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"></path><path d="M9 18h6"></path><path d="M10 22h4"></path></svg>
                <span>Ideas</span>
            </button>

            <button class="nav-item active" id="navCommunity">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
                <span>Community</span>
            </button>

            <button class="nav-item" id="navMessages">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                <span>Messages</span>
            </button>

            <button class="nav-item" id="navNotifications">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg>
                <span>Notifications</span>
            </button>

            <button class="nav-item" id="navProfile">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                <span>Profile</span>
            </button>

        </nav>

        <div class="sidebar-user" id="sidebarUserSection">

            <div class="user-avatar" id="sidebarAvatar">
                ?
            </div>

            <div>
                <strong id="sidebarName">
                    Loading...
                </strong>

                <small id="sidebarEmail">
                    ...
                </small>
                <button id="sidebarLogoutBtn" class="sidebar-logout-btn" type="button">Log out</button>
            </div>

        </div>

    </aside>


    <main class="main-content">

        <header class="topbar">

            <div class="search-container">

                <svg class="search-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>

                <input
                    type="text"
                    id="communitySearch"
                    placeholder="Search founders, investors, students..."
                >

            </div>

            <div class="topbar-actions">

                <button class="icon-button" id="notificationTopBtn" aria-label="Notifications">
                    <svg class="topbar-bell-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg>
                </button>

                <button
                    class="post-button"
                    id="postIdeaBtn"
                >
                    <svg style="width: 14px; height: 14px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                    Post Idea
                </button>

            </div>

        </header>


        <section class="community-page">

            <div class="community-header">

                <div>
                    <h1>Community</h1>

                    <p>
                        Discover innovators, founders, mentors
                        and investors in the InnoNest community.
                    </p>
                </div>

            </div>


            <div class="community-stats">

                <div class="community-stat-card">

                    <span>
                        COMMUNITY MEMBERS
                    </span>

                    <strong id="totalMembers">
                        0
                    </strong>

                </div>


                <div class="community-stat-card">

                    <span>
                        FOUNDERS
                    </span>

                    <strong id="totalFounders">
                        0
                    </strong>

                </div>


                <div class="community-stat-card">

                    <span>
                        MENTORS
                    </span>

                    <strong id="totalMentors">
                        0
                    </strong>

                </div>


                <div class="community-stat-card">

                    <span>
                        INVESTORS
                    </span>

                    <strong id="totalInvestors">
                        0
                    </strong>

                </div>

            </div>


            <div class="community-section">

                <div class="community-section-header">

                    <h2>
                        Discover People
                    </h2>

                    <select id="roleFilter">

                        <option value="all">
                            All Members
                        </option>

                        <option value="Founder">
                            Founders
                        </option>

                        <option value="Investor">
                            Investors
                        </option>

                        <option value="Mentor">
                            Mentors
                        </option>

                        <option value="Student">
                            Students
                        </option>

                    </select>

                </div>


                <div
                    id="communityContainer"
                    class="community-grid"
                >

                    <div class="loading">
                        Loading community...
                    </div>

                </div>

            </div>

        </section>

    </main>


    <script src="js/session.js"></script>
    <script src="js/community.js"></script>

</body>

</html>
