<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>InnovNest - Ideas</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="logo">
            InnovNest
        </div>

        <nav class="sidebar-nav">

            <button id="navHome" class="nav-item">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                <span>Home</span>
            </button>

            <button id="navDiscover" class="nav-item">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"></polygon></svg>
                <span>Discover</span>
            </button>

            <button id="navIdeas" class="nav-item active">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-1 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"></path><path d="M9 18h6"></path><path d="M10 22h4"></path></svg>
                <span>Ideas</span>
            </button>

            <button id="navCommunity" class="nav-item">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
                <span>Community</span>
            </button>

            <button id="navMessages" class="nav-item">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                <span>Messages</span>
            </button>

            <button id="navNotifications" class="nav-item">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg>
                <span>Notifications</span>
            </button>

            <button id="navProfile" class="nav-item">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                <span>Profile</span>
            </button>

        </nav>


        <div class="sidebar-user" id="sidebarUserSection">

            <div class="user-avatar" id="sidebarAvatar">
                ?
            </div>

            <div>

                <strong id="sidebarName">
                    Loading...
                </strong>

                <small id="sidebarEmail">
                    ...
                </small>

                <button id="sidebarLogoutBtn" class="sidebar-logout-btn" type="button">Log out</button>

            </div>

        </div>

    </aside>


    <!-- MAIN -->

    <main class="main-content">

        <!-- TOP BAR -->

        <header class="topbar">

            <div class="search-container">

                <svg class="search-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search ideas, founders, or investors..."
                >

            </div>


            <div class="topbar-actions">

                <button
                    id="notificationTopBtn"
                    class="icon-button"
                    aria-label="Notifications"
                >
                    <svg class="topbar-bell-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg>
                </button>

                <button
                    id="postIdeaBtn"
                    class="post-button"
                >
                    <svg style="width: 14px; height: 14px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                    Post Idea
                </button>

            </div>

        </header>


        <!-- PAGE -->

        <section class="ideas-page">

            <div class="page-header">

                <div>

                    <h1>
                        My Ideas
                    </h1>

                    <p>
                        Manage and track the progress of your startup pitches.
                    </p>

                </div>


                <button
                    id="createIdeaBtn"
                    class="primary-button"
                >
                    <svg style="width: 14px; height: 14px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                    Post New Idea
                </button>

            </div>


            <!-- STATISTICS -->

            <div class="idea-statistics">

                <div class="idea-stat-card">

                    <span>
                        TOTAL IDEAS
                    </span>

                    <strong id="totalIdeas">
                        0
                    </strong>

                </div>


                <div class="idea-stat-card">

                    <span>
                        CONNECTIONS
                    </span>

                    <strong>
                        0
                    </strong>

                </div>


                <div class="idea-stat-card">

                    <span>
                        TOTAL LIKES
                    </span>

                    <strong id="totalLikes">
                        0
                    </strong>

                </div>

            </div>


            <!-- ACTIVE PITCHES -->

            <div class="ideas-section-header">

                <h2>
                    Active Pitches
                </h2>

                <select id="ideaFilter">

                    <option value="all">
                        All Ideas
                    </option>

                    <option value="public">
                        Public
                    </option>

                    <option value="private">
                        Private
                    </option>

                </select>

            </div>


            <!-- IDEAS FROM MONGODB -->

            <div id="ideasContainer">

                <div class="loading">
                    Loading ideas...
                </div>

            </div>

        </section>

    </main>


    <!-- POST IDEA MODAL -->

    <div
        id="ideaModal"
        class="idea-modal hidden"
    >

        <div class="idea-modal-content">

            <div class="modal-header">

                <div>

                    <h2>
                        Post a New Idea
                    </h2>

                    <p>
                        Share your startup idea with the InnoNest community.
                    </p>

                </div>

                <button id="closeIdeaModal">
                    ✕
                </button>

            </div>


            <form id="ideaForm">

                <label>
                    Idea Title

                    <input
                        type="text"
                        id="ideaTitle"
                        placeholder="Enter your startup idea"
                        required
                    >

                </label>


                <label>
                    Description

                    <textarea
                        id="ideaDescription"
                        placeholder="Describe your startup idea..."
                        required
                    ></textarea>

                </label>


                <div class="form-row">

                    <label>
                        Category

                        <select id="ideaCategory">

                            <option value="SaaS">
                                SaaS
                            </option>

                            <option value="FinTech">
                                FinTech
                            </option>

                            <option value="HealthTech">
                                HealthTech
                            </option>

                            <option value="EdTech">
                                EdTech
                            </option>

                            <option value="AI">
                                AI
                            </option>

                            <option value="E-Commerce">
                                E-Commerce
                            </option>

                            <option value="Other">
                                Other
                            </option>

                        </select>

                    </label>


                    <label>
                        Stage

                        <select id="ideaStage">

                            <option value="Idea Stage">
                                Idea Stage
                            </option>

                            <option value="Pre-Seed">
                                Pre-Seed
                            </option>

                            <option value="Seed">
                                Seed
                            </option>

                            <option value="Growth">
                                Growth
                            </option>

                        </select>

                    </label>

                </div>


                <label>
                    Visibility

                    <select id="ideaVisibility">

                        <option value="public">
                            Public
                        </option>

                        <option value="private">
                            Private
                        </option>

                    </select>

                </label>


                <button
                    type="submit"
                    class="submit-idea-button"
                >
                    Publish Idea
                </button>

                <p id="ideaFormMessage"></p>

            </form>

        </div>

    </div>


    <script src="js/session.js"></script>
    <script src="js/ideas.js"></script>

</body>

</html>
